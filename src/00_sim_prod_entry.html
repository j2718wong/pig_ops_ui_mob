<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breeding Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4a6fa5;
            --accent-color: #ff9a76;
        }
        
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 8px;
        }
        
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .form-header {
            background: linear-gradient(135deg, var(--primary-color), #6b8cbc);
            color: white;
            padding: 16px;
            text-align: center;
        }
        
        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }
        
        .form-header .subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .form-body {
            padding: 16px;
        }
        
        .form-section {
            margin-bottom: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
        }
        
        .section-title {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .form-control, .form-select {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2);
        }
        
        /* FIXED: Input group alignment */
        .input-group {
            display: flex;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .input-group .form-select {
            flex: 1;
            border-radius: 6px 0 0 6px;
            margin: 0;
            border-right: 0;
        }
        
        .input-group .btn {
            border-radius: 0 6px 6px 0;
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            font-size: 0.9rem;
            padding: 10px 12px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
        }
        
        .char-counter {
            font-size: 0.8rem;
            color: #6c757d;
            text-align: right;
            margin-top: 3px;
        }
        
        .empty-state {
            text-align: center;
            padding: 20px 12px;
            background: white;
            border: 1px dashed #dee2e6;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        
        .empty-state i {
            font-size: 2rem;
            color: #adb5bd;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            color: #6c757d;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        
        .btn-add-new {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-footer {
            background: white;
            padding: 12px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }
        
        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            font-size: 1rem;
        }
        
        .btn-save {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-cancel {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }
        
        .modal-content {
            border-radius: 10px;
            border: none;
        }
        
        .modal-header {
            background: var(--primary-color);
            color: white;
            padding: 12px 16px;
            border-radius: 10px 10px 0 0;
        }
        
        .modal-body {
            padding: 16px;
        }
        
        /* FIXED: Ensure proper alignment on all devices */
        @media (max-width: 576px) {
            body {
                padding: 4px;
            }
            
            .form-header {
                padding: 12px;
            }
            
            .form-body {
                padding: 12px;
            }
            
            .form-section {
                padding: 10px;
                margin-bottom: 16px;
            }
            
            .section-title {
                font-size: 1rem;
            }
            
            .input-group .btn {
                min-width: 50px;
                padding: 10px 8px;
            }
            
            .form-footer {
                padding: 10px;
            }
            
            .btn-action {
                padding: 8px;
                font-size: 0.95rem;
            }
        }
        
        /* FIXED: Prevent button text wrapping */
        .btn {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1><i class="bi bi-clipboard-heart"></i> Breeding Record</h1>
            <div class="subtitle">Complete all required fields</div>
        </div>
        
        <div class="form-body">
            <!-- 1. Sow Field -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-piggy-bank"></i> Sow</h3>
                <label class="form-label"><i class="bi bi-tag"></i> Select Sow</label>
                <div id="sowEmptyState" class="empty-state" style="display: none;">
                    <i class="bi bi-piggy-bank"></i>
                    <p>No sows available</p>
                    <button type="button" class="btn-add-new" data-bs-toggle="modal" data-bs-target="#newSowModal">
                        <i class="bi bi-plus"></i> Add New Sow
                    </button>
                </div>
                <div class="input-group" id="sowSelectGroup">
                    <select class="form-select" id="sowSelect">
                        <option value="" selected disabled>Select...</option>
                        <option value="sow-001">SOW-001 (Bertha)</option>
                        <option value="sow-002">SOW-002 (Daisy)</option>
                        <option value="sow-003">SOW-003 (Penny)</option>
                    </select>
                    <button class="btn" type="button" data-bs-toggle="modal" data-bs-target="#newSowModal">
                        <i class="bi bi-plus"></i> New
                    </button>
                </div>
            </div>
            
            <!-- 2. Insemination Type -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-gender-ambiguous"></i> Insemination Type</h3>
                <label class="form-label"><i class="bi bi-diagram-3"></i> Type</label>
                <select class="form-select" id="inseminationType" required>
                    <option value="" selected disabled>Select...</option>
                    <option value="boar-mating">Boar Mating</option>
                    <option value="artificial-insemination">Artificial Insemination</option>
                </select>
            </div>
            
            <!-- 3. Date Mating -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-calendar-event"></i> Date</h3>
                <label class="form-label"><i class="bi bi-calendar-date"></i> Date Mating</label>
                <input type="date" class="form-control" id="dateMating" required>
            </div>
            
            <!-- 4. Boar Field -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-gender-male"></i> Boar</h3>
                <label class="form-label"><i class="bi bi-tag"></i> Select Boar</label>
                <div id="boarEmptyState" class="empty-state" style="display: none;">
                    <i class="bi bi-gender-male"></i>
                    <p>No boars available</p>
                    <button type="button" class="btn-add-new" data-bs-toggle="modal" data-bs-target="#newBoarModal">
                        <i class="bi bi-plus"></i> Add New Boar
                    </button>
                </div>
                <div class="input-group" id="boarSelectGroup">
                    <select class="form-select" id="boarSelect">
                        <option value="" selected disabled>Select...</option>
                        <option value="boar-001">BOAR-001 (John)</option>
                        <option value="boar-002">BOAR-002 (Tank)</option>
                        <option value="boar-003">BOAR-003 (Brutus)</option>
                    </select>
                    <button class="btn" type="button" data-bs-toggle="modal" data-bs-target="#newBoarModal">
                        <i class="bi bi-plus"></i> New
                    </button>
                </div>
            </div>
            
            <!-- 5. Other Cost -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-cash-coin"></i> Cost</h3>
                <label class="form-label"><i class="bi bi-currency-dollar"></i> Other Cost (Optional)</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" id="otherCost" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>
            
            <!-- 6. Notes -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-journal-text"></i> Notes</h3>
                <label class="form-label"><i class="bi bi-chat-left"></i> Notes (max 160)</label>
                <textarea class="form-control" id="notes" rows="2" maxlength="160" placeholder="Enter notes..."></textarea>
                <div class="char-counter" id="notesCounter">0/160</div>
            </div>
            
            <!-- 7. Staff -->
            <div class="form-section">
                <h3 class="section-title"><i class="bi bi-people"></i> Staff</h3>
                <label class="form-label"><i class="bi bi-person-badge"></i> Responsible Staff</label>
                <div id="staffEmptyState" class="empty-state" style="display: none;">
                    <i class="bi bi-people"></i>
                    <p>No staff available</p>
                    <button type="button" class="btn-add-new" data-bs-toggle="modal" data-bs-target="#newStaffModal">
                        <i class="bi bi-plus"></i> Add New Staff
                    </button>
                </div>
                <div class="input-group" id="staffSelectGroup">
                    <select class="form-select" id="staffSelect" required>
                        <option value="" selected disabled>Select...</option>
                        <option value="staff-001">John Smith (Manager)</option>
                        <option value="staff-002">Sarah Johnson (Vet)</option>
                        <option value="staff-003">Mike Wilson (Specialist)</option>
                    </select>
                    <button class="btn" type="button" data-bs-toggle="modal" data-bs-target="#newStaffModal">
                        <i class="bi bi-plus"></i> New
                    </button>
                </div>
            </div>
            
            <!-- Footer Buttons -->
            <div class="form-footer">
                <button type="button" class="btn-action btn-cancel" id="cancelBtn">
                    <i class="bi bi-x"></i> Cancel
                </button>
                <button type="button" class="btn-action btn-save" id="saveBtn">
                    <i class="bi bi-check"></i> Save
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modals -->
    <div class="modal fade" id="newSowModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus"></i> Add New Sow</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Sow ID</label>
                        <input type="text" class="form-control" id="sowId" placeholder="SOW-005">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Sow Name</label>
                        <input type="text" class="form-control" id="sowName" placeholder="Bella">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Breed</label>
                        <select class="form-select" id="sowBreed">
                            <option value="">Select breed...</option>
                            <option value="yorkshire">Yorkshire</option>
                            <option value="landrace">Landrace</option>
                            <option value="duroc">Duroc</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="padding: 12px;">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="addNewSow()">Add</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="newBoarModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus"></i> Add New Boar</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Boar ID</label>
                        <input type="text" class="form-control" id="boarId" placeholder="BOAR-004">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Boar Name</label>
                        <input type="text" class="form-control" id="boarName" placeholder="Thor">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Breed</label>
                        <select class="form-select" id="boarBreed">
                            <option value="">Select breed...</option>
                            <option value="yorkshire">Yorkshire</option>
                            <option value="landrace">Landrace</option>
                            <option value="duroc">Duroc</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="padding: 12px;">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="addNewBoar()">Add</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="newStaffModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus"></i> Add New Staff</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="staffName" placeholder="Robert Davis">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <input type="text" class="form-control" id="staffRole" placeholder="Breeding Tech">
                    </div>
                </div>
                <div class="modal-footer" style="padding: 12px;">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="addNewStaff()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateMating').value = today;
            
            const notesTextarea = document.getElementById('notes');
            const notesCounter = document.getElementById('notesCounter');
            
            notesTextarea.addEventListener('input', function() {
                const length = this.value.length;
                notesCounter.textContent = `${length}/160`;
            });
            
            document.getElementById('saveBtn').addEventListener('click', saveForm);
            document.getElementById('cancelBtn').addEventListener('click', cancelForm);
            
            document.getElementById('otherCost').addEventListener('input', function(e) {
                this.value = this.value.replace(/[^\d.]/g, '');
                const parts = this.value.split('.');
                if (parts.length > 2) {
                    this.value = parts[0] + '.' + parts.slice(1).join('');
                }
                if (parts.length === 2 && parts[1].length > 2) {
                    this.value = parts[0] + '.' + parts[1].substring(0, 2);
                }
            });
        });
        
        function addNewSow() {
            const sowId = document.getElementById('sowId').value.trim();
            const sowName = document.getElementById('sowName').value.trim();
            const sowBreed = document.getElementById('sowBreed').value;
            
            if (!sowId || !sowName) {
                alert('Please enter Sow ID and Name');
                return;
            }
            
            const select = document.getElementById('sowSelect');
            const option = document.createElement('option');
            option.value = sowId.toLowerCase().replace(' ', '-');
            option.textContent = `${sowId} (${sowName})${sowBreed ? ' - ' + sowBreed : ''}`;
            select.appendChild(option);
            select.value = option.value;
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('newSowModal'));
            modal.hide();
            document.getElementById('sowId').value = '';
            document.getElementById('sowName').value = '';
            document.getElementById('sowBreed').selectedIndex = 0;
            
            showMessage('Sow added');
        }
        
        function addNewBoar() {
            const boarId = document.getElementById('boarId').value.trim();
            const boarName = document.getElementById('boarName').value.trim();
            const boarBreed = document.getElementById('boarBreed').value;
            
            if (!boarId || !boarName) {
                alert('Please enter Boar ID and Name');
                return;
            }
            
            const select = document.getElementById('boarSelect');
            const option = document.createElement('option');
            option.value = boarId.toLowerCase().replace(' ', '-');
            option.textContent = `${boarId} (${boarName})${boarBreed ? ' - ' + boarBreed : ''}`;
            select.appendChild(option);
            select.value = option.value;
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('newBoarModal'));
            modal.hide();
            document.getElementById('boarId').value = '';
            document.getElementById('boarName').value = '';
            document.getElementById('boarBreed').selectedIndex = 0;
            
            showMessage('Boar added');
        }
        
        function addNewStaff() {
            const staffName = document.getElementById('staffName').value.trim();
            const staffRole = document.getElementById('staffRole').value.trim();
            
            if (!staffName || !staffRole) {
                alert('Please enter Name and Role');
                return;
            }
            
            const select = document.getElementById('staffSelect');
            const option = document.createElement('option');
            option.value = 'staff-' + Date.now();
            option.textContent = `${staffName} (${staffRole})`;
            select.appendChild(option);
            select.value = option.value;
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('newStaffModal'));
            modal.hide();
            document.getElementById('staffName').value = '';
            document.getElementById('staffRole').value = '';
            
            showMessage('Staff added');
        }
        
        function saveForm() {
            const sowSelect = document.getElementById('sowSelect');
            const inseminationType = document.getElementById('inseminationType');
            const dateMating = document.getElementById('dateMating');
            const staffSelect = document.getElementById('staffSelect');
            
            let isValid = true;
            
            if (!sowSelect.value) {
                sowSelect.classList.add('is-invalid');
                isValid = false;
            }
            
            if (!inseminationType.value) {
                inseminationType.classList.add('is-invalid');
                isValid = false;
            }
            
            if (!dateMating.value) {
                dateMating.classList.add('is-invalid');
                isValid = false;
            }
            
            if (!staffSelect.value) {
                staffSelect.classList.add('is-invalid');
                isValid = false;
            }
            
            if (!isValid) {
                showMessage('Fill required fields', 'error');
                return;
            }
            
            const formData = {
                sow: sowSelect.value,
                inseminationType: inseminationType.value,
                dateMating: dateMating.value,
                boar: document.getElementById('boarSelect').value,
                otherCost: document.getElementById('otherCost').value,
                notes: document.getElementById('notes').value,
                staff: document.getElementById('staffSelect').value
            };
            
            console.log('Saved:', formData);
            showMessage('Record saved');
        }
        
        function cancelForm() {
            if (confirm('Cancel changes?')) {
                document.getElementById('sowSelect').selectedIndex = 0;
                document.getElementById('inseminationType').selectedIndex = 0;
                document.getElementById('dateMating').value = new Date().toISOString().split('T')[0];
                document.getElementById('boarSelect').selectedIndex = 0;
                document.getElementById('otherCost').value = '';
                document.getElementById('notes').value = '';
                document.getElementById('staffSelect').selectedIndex = 0;
                document.getElementById('notesCounter').textContent = '0/160';
                
                document.querySelectorAll('.is-invalid').forEach(el => {
                    el.classList.remove('is-invalid');
                });
            }
        }
        
        function showMessage(message, type = 'success') {
            const msg = document.createElement('div');
            msg.className = `alert alert-${type === 'error' ? 'danger' : 'success'} alert-dismissible fade show`;
            msg.style.cssText = 'position:fixed;top:10px;right:10px;z-index:9999;padding:8px 12px;font-size:0.9rem;';
            msg.innerHTML = `${message} <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>`;
            document.body.appendChild(msg);
            
            setTimeout(() => {
                if (msg.parentNode) msg.remove();
            }, 3000);
        }
    </script>
</body>
</html>
