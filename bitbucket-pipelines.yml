# bitbucket-pipelines.yml
image: node:20-bullseye

pipelines:
  branches:
    main:
      - step:
          name: 🔨 Build JS Bundles
          caches:
            - node
          script:
            - npm ci || npm install
            - python3 build.py
            - python3 build.py -v
          artifacts:
            - static/**
      
      - step:
          name: 🚀 Deploy to Server
          script:
            - apt-get update && apt-get install -y openssh-client coreutils
            
            # Create .ssh directory
            - mkdir -p ~/.ssh
            
            # Decode the base64-encoded private key
            - echo "$DIGITAL_OCEAN_PO_PKEY" | base64 -d > ~/.ssh/id_rsa
            
            # Set correct permissions
            - chmod 600 ~/.ssh/id_rsa
            
            # Add server to known hosts
            - ssh-keyscan -H $DIGITAL_OCEAN_PO_SERVER_IP >> ~/.ssh/known_hosts
            
            # Verify the key format (debug - remove after working)
            - file ~/.ssh/id_rsa
            - head -n 2 ~/.ssh/id_rsa
            
            # Deploy
            - echo "Deploying to $DIGITAL_OCEAN_PO_SERVER_USER@$DIGITAL_OCEAN_PO_SERVER_IP:$DIGITAL_OCEAN_PO_DEPLOY_PATH"
            - scp -r -o StrictHostKeyChecking=no static/* $DIGITAL_OCEAN_PO_SERVER_USER@$DIGITAL_OCEAN_PO_SERVER_IP:$DIGITAL_OCEAN_PO_DEPLOY_PATH
