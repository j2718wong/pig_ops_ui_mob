# bitbucket-pipelines.yml
image: node:20-bullseye

pipelines:
  branches:
    main:
      - step:
          name: 🔨 Build JS Bundles
          caches:
            - node
          script:
            - npm ci || npm install
            - python3 build.py
            - python3 build.py -v
            - ls -la static/
          artifacts:
            - static/**
      
      - step:
          name: 🚀 Deploy to Server
          script:
            # Install SSH client
            - apt-get update && apt-get install -y openssh-client
            
            # Setup SSH using workspace variable
            - mkdir -p ~/.ssh
            - echo "$DIGITAL_OCEAN_PO_PKEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H $DIGITAL_OCEAN_PO_SERVER_IP >> ~/.ssh/known_hosts
            
            # Deploy using workspace variables
            - echo "Deploying to $DIGITAL_OCEAN_PO_SERVER_USER@$DIGITAL_OCEAN_PO_SERVER_IP:$DIGITAL_OCEAN_PO_DEPLOY_PATH"
            - scp -r -o StrictHostKeyChecking=no static/* $DIGITAL_OCEAN_PO_SERVER_USER@$DIGITAL_OCEAN_PO_SERVER_IP:$DIGITAL_OCEAN_PO_DEPLOY_PATH
            
            # Optional: Verify deployment
            - ssh $DIGITAL_OCEAN_PO_SERVER_USER@$DIGITAL_OCEAN_PO_SERVER_IP "ls -la $DIGITAL_OCEAN_PO_DEPLOY_PATH"
